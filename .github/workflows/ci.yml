# Runs the repo's checks on every PR and on pushes to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run types:check
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Build (static export)
        run: bun run build
